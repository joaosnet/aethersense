[package]
name = "aethersense-server"
version = "0.1.0"
edition = "2021"
description = "Servidor Rust para captura e análise de dados CSI do ESP32"

[dependencies]
# Web framework
axum = { version = "0.8", features = ["ws", "json"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }

# Serialização
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Numérico
ndarray = "0.16"
rustfft = "6"
num-complex = "0.4"

# Inferência ONNX (Rust puro, sem dylibs — compatível com o container)
tract-onnx = "0.21"

# Utilidades
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
csv = "1"
clap = { version = "4", features = ["derive", "env"] }
chrono = "0.4"
rumqttc = "0.24"
socket2 = "0.6.3"
tempfile = "3"
sha2 = "0.10"

[dev-dependencies]
tokio-test = "0.4"
reqwest = { version = "0.12", features = ["json"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"
approx = "0.5"
