version: 2
updates:
  # aethersense-server Cargo dependencies
  - package-ecosystem: "cargo"
    directory: "/aethersense-server"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      dependencies:
        patterns:
          - "*"

  # firmware-rust Cargo dependencies
  - package-ecosystem: "cargo"
    directory: "/firmware-rust"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      dependencies:
        patterns:
          - "*"

  # Frontend npm dependencies
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      dependencies:
        patterns:
          - "*"

  # ML Python dependencies
  - package-ecosystem: "pip"
    directory: "/ml"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      dependencies:
        patterns:
          - "*"

  # Realtime Plot Python dependencies
  - package-ecosystem: "pip"
    directory: "/esp_realtime_plot"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      dependencies:
        patterns:
          - "*"

  # Firmware Python tooling dependencies
  - package-ecosystem: "pip"
    directory: "/firmware-rust"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      dependencies:
        patterns:
          - "*"
