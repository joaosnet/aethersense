[project]
name = "aethersense-firmware-build"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "keyring>=25.7.0,<26",
    "paho-mqtt>=2.2.0,<3",
    "pyserial>=3.5",
    "textual>=8.2.8,<9",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0,<10",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
