[project]
name = "aethersense-firmware-build"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "keyring>=25.6,<26",
    "paho-mqtt>=2.1,<3",
    "pyserial>=3.5",
    "textual>=6.6,<7",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
