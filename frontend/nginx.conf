server {
    listen 80;
    server_name localhost;

    # ── Compression ──────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # Serve a aplicação React
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        # Redireciona tudo para o index.html para o roteamento do React (SPA) funcionar
        try_files $uri $uri/ /index.html;
    }

    # Proxy para a API REST do Backend Rust
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy para os WebSockets do Backend Rust
    location /ws {
        proxy_pass http://backend:8000/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;

        # Desabilita o timeout para manter a conexão realtime aberta
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }
}
