<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 64" width="80" height="64">
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2c303a" />
      <stop offset="100%" stop-color="#1a1c24" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-opacity="0.6"/>
    </filter>
    <linearGradient id="antenna" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#111" />
      <stop offset="50%" stop-color="#333" />
      <stop offset="100%" stop-color="#111" />
    </linearGradient>
  </defs>

  <!-- Antennas -->
  <!-- Left Antenna -->
  <rect x="12" y="2" width="4" height="24" rx="2" fill="url(#antenna)" transform="rotate(-15 14 26)"/>
  <!-- Middle Antenna -->
  <rect x="38" y="0" width="4" height="26" rx="2" fill="url(#antenna)"/>
  <!-- Right Antenna -->
  <rect x="64" y="2" width="4" height="24" rx="2" fill="url(#antenna)" transform="rotate(15 66 26)"/>

  <!-- Router Body -->
  <rect x="8" y="24" width="64" height="32" rx="6" fill="url(#bodyGrad)" filter="url(#shadow)" stroke="#444" stroke-width="1"/>

  <!-- Top pattern/ventilation -->
  <path d="M 14 30 h 52 v 2 h -52 z M 14 34 h 52 v 2 h -52 z M 14 38 h 52 v 2 h -52 z" fill="#111"/>

  <!-- Front Panel curve -->
  <path d="M 8 48 Q 40 54 72 48 V 50 Q 40 56 8 50 Z" fill="#444"/>

  <!-- Status LEDs -->
  <circle cx="20" cy="52" r="1.5" fill="#0f0" filter="drop-shadow(0 0 2px #0f0)"/> <!-- Power -->
  <circle cx="26" cy="52" r="1.5" fill="#0f0" filter="drop-shadow(0 0 2px #0f0)"/> <!-- WAN -->
  <circle cx="32" cy="52" r="1.5" fill="#0f0" filter="drop-shadow(0 0 2px #0f0)"/> <!-- 2.4G -->
  <circle cx="38" cy="52" r="1.5" fill="#0f0" filter="drop-shadow(0 0 2px #0f0)"/> <!-- 5G -->
  <circle cx="44" cy="52" r="1.5" fill="#0f0" filter="drop-shadow(0 0 2px #0f0)"/> <!-- LAN1 -->

  <!-- Logo/Brand Mark -->
  <text x="66" y="53" font-family="sans-serif" font-size="4" font-weight="bold" fill="#888" text-anchor="end">WIFI 6</text>
</svg>
