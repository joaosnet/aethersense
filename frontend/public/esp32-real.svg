<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 80" width="64" height="80">
  <defs>
    <linearGradient id="pcb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1c23" />
      <stop offset="100%" stop-color="#2a2d34" />
    </linearGradient>
    <linearGradient id="shield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f0f0" />
      <stop offset="50%" stop-color="#d0d0d0" />
      <stop offset="100%" stop-color="#909090" />
    </linearGradient>
    <linearGradient id="pin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b8860b" />
      <stop offset="100%" stop-color="#ffd700" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Base Shadow & PCB -->
  <rect x="8" y="4" width="48" height="72" rx="2" fill="url(#pcb)" filter="url(#shadow)" stroke="#111" stroke-width="1"/>

  <!-- Antenna Area -->
  <rect x="14" y="6" width="36" height="14" fill="#0f1115" rx="1"/>
  <path d="M 16 8 h 32 v 2 h -30 v 2 h 28 v 2 h -26 v 2 h 24" fill="none" stroke="#c0a040" stroke-width="1.5" stroke-linejoin="miter"/>

  <!-- Metal Shield (ESP-WROOM-32) -->
  <rect x="14" y="24" width="36" height="28" rx="2" fill="url(#shield)" stroke="#707070" stroke-width="1"/>
  <!-- Shield Text -->
  <text x="32" y="34" font-family="monospace" font-size="5" font-weight="bold" fill="#333" text-anchor="middle">ESP32</text>
  <text x="32" y="40" font-family="monospace" font-size="3" fill="#444" text-anchor="middle">WROOM-32</text>

  <!-- Micro USB Port -->
  <rect x="24" y="74" width="16" height="6" rx="1" fill="#c0c0c0" stroke="#555" stroke-width="0.5"/>
  <rect x="26" y="76" width="12" height="2" fill="#111"/>

  <!-- Boot & EN Buttons -->
  <rect x="14" y="66" width="6" height="4" rx="0.5" fill="#111" stroke="#333" stroke-width="0.5"/>
  <circle cx="17" cy="68" r="1.5" fill="#e0e0e0"/>
  <rect x="44" y="66" width="6" height="4" rx="0.5" fill="#111" stroke="#333" stroke-width="0.5"/>
  <circle cx="47" cy="68" r="1.5" fill="#e0e0e0"/>

  <!-- Left Pins -->
  <g fill="url(#pin)">
    <rect x="4" y="16" width="4" height="2" /><rect x="4" y="20" width="4" height="2" />
    <rect x="4" y="24" width="4" height="2" /><rect x="4" y="28" width="4" height="2" />
    <rect x="4" y="32" width="4" height="2" /><rect x="4" y="36" width="4" height="2" />
    <rect x="4" y="40" width="4" height="2" /><rect x="4" y="44" width="4" height="2" />
    <rect x="4" y="48" width="4" height="2" /><rect x="4" y="52" width="4" height="2" />
    <rect x="4" y="56" width="4" height="2" /><rect x="4" y="60" width="4" height="2" />
    <rect x="4" y="64" width="4" height="2" /><rect x="4" y="68" width="4" height="2" />
    <rect x="4" y="72" width="4" height="2" />
  </g>
  <!-- Right Pins -->
  <g fill="url(#pin)">
    <rect x="56" y="16" width="4" height="2" /><rect x="56" y="20" width="4" height="2" />
    <rect x="56" y="24" width="4" height="2" /><rect x="56" y="28" width="4" height="2" />
    <rect x="56" y="32" width="4" height="2" /><rect x="56" y="36" width="4" height="2" />
    <rect x="56" y="40" width="4" height="2" /><rect x="56" y="44" width="4" height="2" />
    <rect x="56" y="48" width="4" height="2" /><rect x="56" y="52" width="4" height="2" />
    <rect x="56" y="56" width="4" height="2" /><rect x="56" y="60" width="4" height="2" />
    <rect x="56" y="64" width="4" height="2" /><rect x="56" y="68" width="4" height="2" />
    <rect x="56" y="72" width="4" height="2" />
  </g>
  <!-- Pin holes on PCB -->
  <g fill="#000">
    <circle cx="10" cy="17" r="1"/><circle cx="10" cy="21" r="1"/><circle cx="10" cy="25" r="1"/><circle cx="10" cy="29" r="1"/><circle cx="10" cy="33" r="1"/><circle cx="10" cy="37" r="1"/><circle cx="10" cy="41" r="1"/><circle cx="10" cy="45" r="1"/><circle cx="10" cy="49" r="1"/><circle cx="10" cy="53" r="1"/><circle cx="10" cy="57" r="1"/><circle cx="10" cy="61" r="1"/><circle cx="10" cy="65" r="1"/><circle cx="10" cy="69" r="1"/><circle cx="10" cy="73" r="1"/>
    <circle cx="54" cy="17" r="1"/><circle cx="54" cy="21" r="1"/><circle cx="54" cy="25" r="1"/><circle cx="54" cy="29" r="1"/><circle cx="54" cy="33" r="1"/><circle cx="54" cy="37" r="1"/><circle cx="54" cy="41" r="1"/><circle cx="54" cy="45" r="1"/><circle cx="54" cy="49" r="1"/><circle cx="54" cy="53" r="1"/><circle cx="54" cy="57" r="1"/><circle cx="54" cy="61" r="1"/><circle cx="54" cy="65" r="1"/><circle cx="54" cy="69" r="1"/><circle cx="54" cy="73" r="1"/>
  </g>
</svg>
