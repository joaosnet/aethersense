                <!-- Wrapper que lida com a animação local do elemento -->
                <g class="anim-human-group">
                    <!-- Modelo 1: Realista/Sólido -->
                    <g class="runner-model-1" style="display: block;">
                        <g fill="none" stroke="var(--c-cut)" stroke-linecap="round" stroke-linejoin="round">
