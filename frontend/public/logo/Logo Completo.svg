                </g>
                <g class="hex-wireframe">
                    <polygon points="0,-115 100,-58 100,58 0,115 -100,58 -100,-58"></polygon>
                    <polygon points="0,-165 142,-82 142,82 0,165 -142,82 -142,-82"></polygon>
                    <line x1="0" y1="-115" x2="0" y2="-165"></line><line x1="100" y1="-58" x2="142" y2="-82"></line><line x1="100" y1="58" x2="142" y2="82"></line><line x1="0" y1="115" x2="0" y2="165"></line><line x1="-100" y1="58" x2="-142" y2="82"></line><line x1="-100" y1="-58" x2="-142" y2="-82"></line><line x1="-100" y1="58" x2="-20" y2="105"></line><line x1="100" y1="58" x2="20" y2="105"></line><line x1="-40" y1="93" x2="0" y2="115"></line><line x1="40" y1="93" x2="0" y2="115"></line>
                </g>
