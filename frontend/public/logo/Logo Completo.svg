                <circle cx="-45" cy="110" r="5" class="fill-accent anim-node-d1"></circle>
                <circle class="scale-handle" cx="-10" cy="95" r="8"></circle>
            </g>

            <!-- 5. NÓS DIREITA -->
            <g class="draggable pos-nodes-r" data-var-x="tx-nodes-r" data-var-y="ty-nodes-r" data-var-s="s-nodes-r">
                <path class="invisible-hit" stroke-width="15" d="M 60,-10 L 90,-40 M 110,0 L 125,25 L 95,55 M 95,85 L 75,60 L 115,25 M 40,5 L 60,-10 L 90,-40 L 110,0 L 90,25 L 60,-10 M 90,-40 L 125,-15 L 110,0 M 90,25 L 125,25 L 95,55 L 75,60 L 50,40 M 95,55 L 115,75 L 95,85 L 75,60"></path>
