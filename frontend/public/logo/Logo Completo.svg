                <path class="heartbeat-line anim-heartbeat" d="M -160,28 L -85,28 L -70,45 L -45,-45 L -15,95 L 15,-15 L 35,28 L 85,28"></path>
                <circle class="scale-handle" cx="85" cy="28" r="8"></circle>
