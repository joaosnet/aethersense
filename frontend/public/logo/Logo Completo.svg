<svg class="aether-svg" style="--c-main: #004b87; --c-accent: #f36622; --c-light: #92b2d6; --c-cut: #ffffff; --c-text: #111111; --tx-human: 12px; --ty-human: 32px; --s-human: 1; --tx-heart: -20px; --ty-heart: -18px; --s-heart: 0.45; --tx-wifi: -4px; --ty-wifi: -6px; --s-wifi: 1; --tx-nodes-l: 1px; --ty-nodes-l: -36px; --s-nodes-l: 1; --tx-nodes-r: 0px; --ty-nodes-r: 0px; --s-nodes-r: 1; --tx-hex-wire: 0px; --ty-hex-wire: 0px; --s-hex-wire: 1; --tx-hex-main: 0px; --ty-hex-main: 0px; --s-hex-main: 1; --tx-sun: -43px; --ty-sun: -50px; --s-sun: 0.3;" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
                            <defs><style>
            .hex-wireframe { fill: none; stroke: var(--c-light); stroke-width: 2.5; stroke-linejoin: round; }
            .hex-main { fill: none; stroke: var(--c-main); stroke-width: 8; stroke-linejoin: round; }
            .wifi-arc { fill: none; stroke: var(--c-main); stroke-width: 14; stroke-linecap: round; }
            .heartbeat-line { fill: none; stroke: var(--c-accent); stroke-width: 6; stroke-linejoin: round; stroke-linecap: round; }
            .heartbeat-cut { fill: none; stroke: var(--c-cut); stroke-width: 12; stroke-linejoin: round; stroke-linecap: round; }
            .node-edge { fill: none; stroke: var(--c-main); stroke-width: 1.5; }
            .node-edge-cut { fill: none; stroke: var(--c-cut); stroke-width: 5; }
            .fill-main { fill: var(--c-main); }
            .fill-accent { fill: var(--c-accent); }
            .invisible-hit, .scale-handle { display: none; }

            .pos-hex-wire { transform: translate(var(--tx-hex-wire), var(--ty-hex-wire)) scale(var(--s-hex-wire)); transform-box: fill-box; transform-origin: center; }
            .pos-hex-main { transform: translate(var(--tx-hex-main), var(--ty-hex-main)) scale(var(--s-hex-main)); transform-box: fill-box; transform-origin: center; }
            .pos-sun { transform: translate(var(--tx-sun), var(--ty-sun)) scale(var(--s-sun)); transform-box: fill-box; transform-origin: center; }
            .pos-human { transform: translate(var(--tx-human), var(--ty-human)) scale(var(--s-human)); transform-box: fill-box; transform-origin: center; }
            .pos-heart { transform: translate(var(--tx-heart), var(--ty-heart)) scale(var(--s-heart)); transform-box: fill-box; transform-origin: center; }
            .pos-wifi { transform: translate(var(--tx-wifi), var(--ty-wifi)) scale(var(--s-wifi)); transform-box: fill-box; transform-origin: center; }
            .pos-nodes-l { transform: translate(var(--tx-nodes-l), var(--ty-nodes-l)) scale(var(--s-nodes-l)); transform-box: fill-box; transform-origin: center; }
            .pos-nodes-r { transform: translate(var(--tx-nodes-r), var(--ty-nodes-r)) scale(var(--s-nodes-r)); transform-box: fill-box; transform-origin: center; }
        </style></defs>

                        <style>
                            @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&amp;display=swap');
                            .title-text { font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 68px; fill: var(--c-main); text-anchor: middle; letter-spacing: -1.5px; }
                            .title-wifi { fill: none; stroke: var(--c-accent); stroke-linecap: round; }
                            .subtitle-text { font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: 14.5px; fill: var(--c-text); text-anchor: middle; letter-spacing: 0.2px; }
                        </style>
                        <g transform="translate(300, 165) scale(0.95)">
            <!-- 8. CAIXA 3D (Wireframe) -->
