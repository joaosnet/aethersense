                <path class="node-edge" d="M 40,5 L 60,-10 L 90,-40 L 110,0 L 90,25 L 60,-10 M 90,-40 L 125,-15 L 110,0 M 90,25 L 125,25 L 95,55 L 75,60 L 50,40 M 95,55 L 115,75 L 95,85 L 75,60"></path>
                <circle cx="60" cy="-10" r="4.5" class="fill-main anim-node"></circle>
                <circle cx="90" cy="-40" r="6.5" class="fill-accent anim-node-d2"></circle>
                <circle cx="125" cy="-15" r="4" class="fill-main"></circle>
                <circle cx="110" cy="0" r="5" class="fill-main anim-node-d1"></circle>
                <circle cx="90" cy="25" r="7" class="fill-accent"></circle>
                <circle cx="125" cy="25" r="4.5" class="fill-main anim-node-d2"></circle>
                <circle cx="95" cy="55" r="5.5" class="fill-main"></circle>
