# Broker MQTT do AetherSense — usado pelo backend (publica detecção/discovery)
# e pelo Home Assistant (consome via host.docker.internal:1883).
# Rede local confiável; sem autenticação (igual ao padrão do add-on Mosquitto
# em modo anônimo). Para expor fora da LAN, adicione password_file.
listener 1883
allow_anonymous true
persistence true
persistence_location /mosquitto/data/
log_dest stdout
