[project]
name = "aethersense-ml"
version = "0.1.0"
description = "AetherSense ML pipeline — CSI-based occupancy detection"
requires-python = ">=3.11"

dependencies = [
    # Core ML
    "torch>=2.1",
    "torchvision>=0.16",
    "onnx>=1.22.0",
    "onnxruntime>=1.17",
    # Data
    "numpy>=1.26",
    "pandas>=2.0",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "pillow>=10.0",
    "h5py>=3.9",
    # Console / Progress
    "rich>=13.7",
    # Relatório HTML
    "jinja2>=3.1",
    "matplotlib>=3.8",
    # Dataset download helpers
    "requests>=2.31",
    "zenodo-get>=0.4",
    "kaggle>=1.6",
    "gdown>=5.0",
]

[tool.uv]
# To install with CUDA support, run:
#   uv sync --extra cu124
# or set TORCH_INDEX_URL before syncing

[project.optional-dependencies]
cu124 = [
    "torch>=2.1; extra == 'cu124'",
]

[project.scripts]
train = "train:main"
export-onnx = "export_onnx:main"
